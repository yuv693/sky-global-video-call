<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Global Video Call</title>
    <!-- PeerJS Library -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { color: #38bdf8; margin-bottom: 5px; margin-top: 0; text-align: center; }
        .card {
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            margin-bottom: 12px;
            text-align: center;
            border: 1px solid #334155;
        }
        .input-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            margin-bottom: 10px;
        }
        input, select {
            width: 75%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
        }
        .mic-btn {
            background: #475569;
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        .mic-btn.listening {
            background: #dc2626;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            margin: 4px;
            width: 85%;
        }
        button:hover { background: #0369a1; }
        #switch-btn { background-color: #ea580c; display: none; width: auto; padding: 8px 15px; }
        #switch-btn:hover { background-color: #c2410c; }
        
        #end-call-btn { background-color: #dc2626; display: none; }
        #end-call-btn:hover { background-color: #b91c1c; }

        #record-btn { background-color: #7c3aed; display: none; }
        #record-btn:hover { background-color: #6d28d9; }
        #record-btn.recording { background-color: #dc2626; animation: pulse 1s infinite; }

        .status-text { color: #34d399; font-size: 15px; font-weight: bold; }
        .video-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            height: 200px;
            background: #1e293b;
            border-radius: 12px;
            border: 2px solid #334155;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .label {
            position: absolute;
            top: 6px;
            left: 6px;
            background: rgba(0,0,0,0.7);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            color: #e2e8f0;
        }
        #group-videos {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            width: 100%;
            max-width: 400px;
        }
        .remote-box {
            position: relative;
            width: 48%;
            height: 150px;
            background: #1e293b;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #475569;
        }
        .remote-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <h2>Sky Global Video Call</h2>

    <!-- 1. Welcome Page -->
    <div class="card" id="welcome-card">
        <h3>Welcome!</h3>
        <p style="font-size: 13px; color: #94a3b8; margin-top: 0;">Apna naam aur mobile number darj karein:</p>
        <input type="text" id="user-name" placeholder="Aapka Naam" style="width: 85%; margin-bottom: 10px;">
        <br>
        <div class="input-group" style="width: 85%; margin: 0 auto 10px auto;">
            <input type="tel" id="user-phone" placeholder="Mobile Number" style="width: 100%; margin-bottom: 0;">
            <button class="mic-btn" onclick="startVoiceInput('user-phone', event)" title="Bolkar type karein">🎙️</button>
        </div>
        <br>
        <button onclick="saveUserProfile()">Save & Start</button>
    </div>

    <!-- 2. Dashboard Page -->
    <div class="card" id="dashboard-card" style="display: none;">
        <p style="margin: 0 0 8px 0;">Swagat hai, <span id="profile-name" style="color: #38bdf8; font-weight: bold;"></span>!</p>
        <p style="margin: 0 0 10px 0;">Aapki ID: <span id="display-my-id" class="status-text"></span></p>
        
        <!-- Contact Save Section -->
        <div style="background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #334155;">
            <p style="margin: 0 0 6px 0; font-size: 13px; color: #38bdf8;">Naya Contact Jodein:</p>
            <input type="text" id="contact-name" placeholder="Dost ka Naam" style="width: 85%; margin-bottom: 6px;">
            <div class="input-group" style="width: 85%; margin: 0 auto 6px auto;">
                <input type="tel" id="contact-phone" placeholder="Dost ka Mobile Number" style="width: 100%; margin-bottom: 0;">
                <button class="mic-btn" onclick="startVoiceInput('contact-phone', event)" title="Bolkar number dalein">🎙</button>
            </div>
            <button onclick="saveContact()" style="background-color: #059669; width: 85%; font-size: 13px; padding: 8px;">Contact Save Karein</button>
            <button onclick="downloadContactsBackup()" style="background-color: #475569; width: 85%; font-size: 12px; padding: 6px; margin-top: 6px;">📥 Contacts Download (Backup)</button>
        </div>

        <!-- Saved Contacts Dropdown -->
        <div style="margin-bottom: 10px;">
            <select id="saved-contacts-dropdown" onchange="selectContact(this)">
                <option value="">-- Saved Contacts Se Chunein --</option>
            </select>
        </div>

        <div class="input-group" style="width: 85%; margin: 0 auto 10px auto;">
            <input type="text" id="partner-phone-input" placeholder="Dost ka Mobile Number" style="width: 100%; margin-bottom: 0;">
            <button class="mic-btn" onclick="startVoiceInput('partner-phone-input', event)" title="Bolkar number dalein">🎙</button>
        </div>
        <br>
        <button onclick="connectCall()">Ek-ke-Ek Call Lagayein</button>
        <button onclick="startGroupCall()" style="background-color: #16a34a;">Group Call Room Banayein</button>
        <button id="record-btn" onclick="toggleRecording()">🔴 Record Call (Start)</button>
        <button id="end-call-btn" onclick="endCall()">Call Kaatein (End Call)</button>
        <br>
        <button id="switch-btn" onclick="switchCamera()">Switch Camera</button>
    </div>

    <!-- 3. Video Area -->
    <div class="video-container">
        <div class="video-wrapper">
            <span class="label">Aapka Camera</span>
            <video id="local-video" autoplay playsinline muted></video>
        </div>
        <div id="group-videos"></div>
    </div>

    <script>
        const welcomeCard = document.getElementById('welcome-card');
        const dashboardCard = document.getElementById('dashboard-card');
        const userNameInput = document.getElementById('user-name');
        const userPhoneInput = document.getElementById('user-phone');
        const profileNameSpan = document.getElementById('profile-name');
        const displayMyId = document.getElementById('display-my-id');
        const partnerPhoneInput = document.getElementById('partner-phone-input');
        const contactNameInput = document.getElementById('contact-name');
        const contactPhoneInput = document.getElementById('contact-phone');
        const savedContactsDropdown = document.getElementById('saved-contacts-dropdown');
        const localVideo = document.getElementById('local-video');
        const groupVideos = document.getElementById('group-videos');
        const switchBtn = document.getElementById('switch-btn');
        const endCallBtn = document.getElementById('end-call-btn');
        const recordBtn = document.getElementById('record-btn');

        let peer;
        let localStream;
        let currentCall = null;
        let currentFacingMode = 'user';
        let myUniqueId = '';
        
        let mediaRecorder;
        let recordedChunks = [];

        window.onload = function() {
            const savedName = localStorage.getItem('sky_user_name');
            const savedPhone = localStorage.getItem('sky_user_phone');
            
            if (savedName && savedPhone) {
                userNameInput.value = savedName;
                userPhoneInput.value = savedPhone;
                saveUserProfile();
            }
            loadContacts();
        };

        const lowBandwidthConstraints = {
            video: { 
                facingMode: currentFacingMode,
                width: { ideal: 320 },
                height: { ideal: 240 },
                frameRate: { max: 15 }
            },
            audio: {
                echoCancellation: true,
                noiseSuppression: true
            }
        };

        navigator.mediaDevices.getUserMedia(lowBandwidthConstraints)
            .then(stream => {
                localStream = stream;
                localVideo.srcObject = stream;
            })
            .catch(err => {
                console.error("Camera error:", err);
            });

        function startVoiceInput(targetId, event) {
            const inputField = document.getElementById(targetId);
            const btn = event.currentTarget;

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Aapka browser voice typing support nahi karta!");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            btn.classList.add('listening');
            recognition.start();

            recognition.onresult = (event) => {
                let speechText = event.results[0][0].transcript;
                speechText = speechText.replace(/\s+/g, ''); 
                inputField.value = speechText;
                btn.classList.remove('listening');
            };

            recognition.onerror = () => {
                alert("Awaz sunai nahi di, dobara koshish karein.");
                btn.classList.remove('listening');
            };

            recognition.onspeechend = () => {
                recognition.stop();
                btn.classList.remove('listening');
            };
        }

        function saveUserProfile() {
            const name = userNameInput.value.trim();
            const phone = userPhoneInput.value.trim();

            if (!name || !phone) {
                alert("Kripya apna naam aur mobile number bharein!");
                return;
            }

            localStorage.setItem('sky_user_name', name);
            localStorage.setItem('sky_user_phone', phone);

            myUniqueId = "sky_" + phone;

            peer = new Peer(myUniqueId);

            peer.on('open', (id) => {
                profileNameSpan.innerText = name;
                displayMyId.innerText = phone;
                welcomeCard.style.display = 'none';
                dashboardCard.style.display = 'block';

                if (/Mobi|Android/i.test(navigator.userAgent)) {
                    switchBtn.style.display = 'inline-block';
                }
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    profileNameSpan.innerText = name;
                    displayMyId.innerText = phone;
                    welcomeCard.style.display = 'none';
                    dashboardCard.style.display = 'block';
                } else {
                    alert("Connection error: " + err.type);
                }
            });

            peer.on('call', (call) => {
                currentCall = call;
                call.answer(localStream);
                call.on('stream', (remoteStream) => {
                    appendRemoteVideo(call.peer, remoteStream);
                    endCallBtn.style.display = 'inline-block';
                    recordBtn.style.display = 'inline-block';
                });
                call.on('close', () => {
                    resetCallUI();
                });
            });
        }

        // Contact Management & Download Backup
        function saveContact() {
            const name = contactNameInput.value.trim();
            const phone = contactPhoneInput.value.trim();

            if (!name || !phone) {
                alert("Kripya contact ka naam aur number dono bharein!");
                return;
            }

            let contacts = JSON.parse(localStorage.getItem('sky_saved_contacts') || '[]');
            contacts.push({ name, phone });
            localStorage.setItem('sky_saved_contacts', JSON.stringify(contacts));

            contactNameInput.value = '';
            contactPhoneInput.value = '';
            loadContacts();
            alert("Contact successfully save ho gaya!");
        }

        function loadContacts() {
            let contacts = JSON.parse(localStorage.getItem('sky_saved_contacts') || '[]');
            savedContactsDropdown.innerHTML = '<option value="">-- Saved Contacts Se Chunein --</option>';
            contacts.forEach(c => {
                let opt = document.createElement('option');
                opt.value = c.phone;
                opt.textContent = c.name + " (" + c.phone + ")";
                savedContactsDropdown.appendChild(opt);
            });
        }

        function selectContact(selectObj) {
            if (selectObj.value) {
                partnerPhoneInput.value = selectObj.value;
            }
        }

        function downloadContactsBackup() {
            let contacts = localStorage.getItem('sky_saved_contacts') || '[]';
            let blob = new Blob([contacts], { type: 'application/json' });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = 'sky_contacts_backup.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        // Call Recording & Download Feature
        function toggleRecording() {
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                startRecording();
            } else {
                stopRecording();
            }
        }

        function startRecording() {
            recordedChunks = [];
            if (!localStream) {
                alert("Recording ke liye camera stream available nahi hai!");
                return;
            }

            try {
                mediaRecorder = new MediaRecorder(localStream, { mimeType: 'video/webm;codecs=vp8,opus' });
            } catch (e) {
                try {
                    mediaRecorder = new MediaRecorder(localStream);
                } catch (err) {
                    alert("Aapka browser video recording support nahi karta!");
                    return;
                }
            }

            mediaRecorder.ondataavailable = function(event) {
                if (event.data && event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = function() {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = 'sky-call-recording-' + Date.now() + '.webm';
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 100);
                alert("Call recording download ho gayi hai!");
            };

            mediaRecorder.start();
            recordBtn.innerText = "⏹️ Stop & Download Recording";
            recordBtn.classList.add('recording');
            alert("Recording shuru ho chuki hai...");
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
                recordBtn.innerText = "🔴 Record Call (Start)";
                recordBtn.classList.remove('recording');
            }
        }

        function connectCall() {
            const partnerPhone = partnerPhoneInput.value.trim();
            if (!partnerPhone) {
                alert("Dost ka mobile number daalein ya select karein!");
                return;
            }

            const partnerPeerId = "sky_" + partnerPhone;
            if (partnerPeerId === myUniqueId) {
                alert("Khud ko call nahi lag sakti!");
                return;
            }

            const call = peer.call(partnerPeerId, localStream);
            currentCall = call;

            call.on('stream', (remoteStream) => {
                appendRemoteVideo(partnerPeerId, remoteStream);
                endCallBtn.style.display = 'inline-block';
                recordBtn.style.display = 'inline-block';
            });
            call.on('close', () => {
                resetCallUI();
            });
            alert("Call connect ki ja rahi hai...");
        }

        function startGroupCall() {
            const roomName = prompt("Group Call ke liye Room ka naam ya number daalein:");
            if (!roomName) return;

            const groupPeerId = "sky_group_" + roomName;
            const call = peer.call(groupPeerId, localStream);
            currentCall = call;

            call.on('stream', (remoteStream) => {
                appendRemoteVideo(groupPeerId, remoteStream);
                endCallBtn.style.display = 'inline-block';
                recordBtn.style.display = 'inline-block';
            });
            call.on('close', () => {
                resetCallUI();
            });
            alert("Group Room mein jud gaye hain!");
        }

        function endCall() {
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                stopRecording();
            }
            if (currentCall) {
                currentCall.close();
            }
            resetCallUI();
            alert("Call kaat di gayi hai.");
        }

        function resetCallUI() {
            groupVideos.innerHTML = '';
            endCallBtn.style.display = 'none';
            recordBtn.style.display = 'none';
            currentCall = null;
        }

        function appendRemoteVideo(id, stream) {
            let existingBox = document.getElementById('box-' + id);
            if (existingBox) {
                existingBox.querySelector('video').srcObject = stream;
                return;
            }

            const box = document.createElement('div');
            box.className = 'remote-box';
            box.id = 'box-' + id;

            const vid = document.createElement('video');
            vid.autoplay = true;
            vid.playsInline = true;
            vid.srcObject = stream;

            box.appendChild(vid);
            groupVideos.appendChild(box);
        }

        function switchCamera() {
            currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
            
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }

            const updatedConstraints = {
                video: { 
                    facingMode: currentFacingMode,
                    width: { ideal: 320 },
                    height: { ideal: 240 },
                    frameRate: { max: 15 }
                },
                audio: true
            };

            navigator.mediaDevices.getUserMedia(updatedConstraints)
                .then(stream => {
                    localStream = stream;
                    localVideo.srcObject = stream;
                    replaceTrack(stream);
                })
                .catch(err => console.error(err));
        }

        function replaceTrack(newStream) {
            const videoTrack = newStream.getVideoTracks()[0];
            if (peer && peer.connections) {
                Object.keys(peer.connections).forEach(connId => {
                    peer.connections[connId].forEach(connection => {
                        if (connection.peerConnection) {
                            const sender = connection.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                            if (sender) {
                                sender.replaceTrack(videoTrack);
                            }
                        }
                    });
                });
            }
        }
    </script>
</body>
</html>
