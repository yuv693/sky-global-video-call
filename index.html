<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Global Video Call - Satellite Ready</title>
    <!-- Favicon Logo -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌐</text></svg>">
    <!-- PeerJS Library -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #090d16, #1e1b4b);
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .app-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 2px;
        }
        .logo-icon {
            font-size: 28px;
            animation: rotateLogo 10s linear infinite;
        }
        @keyframes rotateLogo {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        h2 { color: #38bdf8; margin: 0; text-align: center; }
        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 14px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            margin-bottom: 12px;
            text-align: center;
            border: 1px solid #334155;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .input-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            margin-bottom: 10px;
        }
        input, select {
            width: 75%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
        }
        .mic-btn, .phonebook-btn {
            background: #475569;
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        .phonebook-btn { background-color: #059669; }
        .mic-btn.listening {
            background: #dc2626;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            margin: 4px;
            width: 85%;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.3);
        }
        button:hover { background: #0369a1; }
        #switch-btn { background-color: #ea580c; display: none; width: auto; padding: 8px 15px; }
        #switch-btn:hover { background-color: #c2410c; }
        
        #end-call-btn { background-color: #dc2626; display: none; }
        #end-call-btn:hover { background-color: #b91c1c; }

        #record-btn { background-color: #7c3aed; display: none; }
        #record-btn:hover { background-color: #6d28d9; }
        #record-btn.recording { background-color: #dc2626; animation: pulse 1s infinite; }

        .status-text { color: #34d399; font-size: 15px; font-weight: bold; }
        .sat-badge {
            background: rgba(14, 165, 233, 0.15);
            border: 1px dashed #38bdf8;
            padding: 8px;
            border-radius: 8px;
            font-size: 12px;
            color: #38bdf8;
            margin-bottom: 10px;
            text-align: left;
        }

        /* WhatsApp Style Full Screen Call Interface */
        #call-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
            flex-direction: column;
            justify-content: space-between;
        }
        #remote-video-fullscreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        .local-video-pip {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 100px;
            height: 150px;
            background: #222;
            border-radius: 10px;
            border: 2px solid #fff;
            object-fit: cover;
            z-index: 2;
        }
        .call-controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 15px;
            z-index: 3;
        }
        .call-controls button {
            width: auto;
            padding: 12px 20px;
            border-radius: 50px;
            font-size: 14px;
        }

        /* Normal Video Preview Area */
        .video-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            height: 200px;
            background: #1e293b;
            border-radius: 12px;
            border: 2px solid #334155;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .label {
            position: absolute;
            top: 6px;
            left: 6px;
            background: rgba(0,0,0,0.7);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            color: #e2e8f0;
        }
        #group-videos {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            width: 100%;
            max-width: 400px;
        }
        .remote-box {
            position: relative;
            width: 48%;
            height: 150px;
            background: #1e293b;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #475569;
        }
        .remote-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="app-header" id="main-header">
        <span class="logo-icon">🌐</span>
        <h2>Sky Global Video Call</h2>
    </div>
    <p id="main-subtext" style="color: #94a3b8; font-size: 12px; margin-top: 2px; margin-bottom: 15px;">🛰️️ Starlink Direct-to-Cell Ready Architecture</p>

    <!-- 1. Welcome Page -->
    <div class="card" id="welcome-card">
        <h3>Welcome Traveler!</h3>
        <p style="font-size: 13px; color: #94a3b8; margin-top: 0;">Apna naam aur mobile number darj karein:</p>
        <input type="text" id="user-name" placeholder="Aapka Naam" style="width: 85%; margin-bottom: 10px;">
        <br>
        <div class="input-group" style="width: 85%; margin: 0 auto 10px auto;">
            <input type="tel" id="user-phone" placeholder="Mobile Number" style="width: 100%; margin-bottom: 0;">
            <button class="mic-btn" onclick="startVoiceInput('user-phone', event)" title="Bolkar type karein">🎙️</button>
        </div>
        <br>
        <button onclick="saveUserProfile()">Save & Start</button>
    </div>

    <!-- 2. Dashboard Page -->
    <div class="card" id="dashboard-card" style="display: none;">
        <p style="margin: 0 0 8px 0;">Swagat hai, <span id="profile-name" style="color: #38bdf8; font-weight: bold;"></span>!</p>
        <p style="margin: 0 0 10px 0;">Aapki ID: <span id="display-my-id" class="status-text"></span></p>
        
        <!-- Satellite Status Box -->
        <div class="sat-badge">
            🛰️ <b>D2C Satellite Link:</b> <span id="net-status">Online / Low-Bandwidth Mode</span><br>
            <span style="font-size: 11px; color: #94a3b8;">Optimized for Remote & Deep Sea Travel</span>
        </div>

        <!-- Phone Contacts Import Section -->
        <div style="background: #0f172a; padding: 10px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #334155;">
            <p style="margin: 0 0 6px 0; font-size: 13px; color: #38bdf8;">Travel Contacts:</p>
            <button class="phonebook-btn" onclick="pickContactFromPhone()" style="width: 85%; font-size: 13px; padding: 8px; margin-bottom: 6px;">📇 Phone Contact Choose Karein</button>
            <button onclick="downloadContactsBackup()" style="background-color: #475569; width: 85%; font-size: 12px; padding: 6px;">📥 Contacts Backup Download</button>
        </div>

        <!-- Saved Contacts Dropdown -->
        <div style="margin-bottom: 10px;">
            <select id="saved-contacts-dropdown" onchange="selectContact(this)">
                <option value="">-- Saved Travelers --</option>
            </select>
        </div>

        <div class="input-group" style="width: 85%; margin: 0 auto 10px auto;">
            <input type="text" id="partner-phone-input" placeholder="Dost ka Mobile Number" style="width: 100%; margin-bottom: 0;">
            <button class="mic-btn" onclick="startVoiceInput('partner-phone-input', event)" title="Bolkar number dalein">🎙</button>
        </div>
        <br>
        <button onclick="connectCall()">Ek-ke-Ek Call Lagayein</button>
        <button onclick="startGroupCall()" style="background-color: #16a34a;">Group Travel Room Banayein</button>
        <button id="record-btn" onclick="toggleRecording()">🔴 Record Call (Start)</button>
        <button id="end-call-btn" onclick="endCall()">Call Kaatein (End Call)</button>
        <br>
        <button id="switch-btn" onclick="switchCamera()">Switch Camera</button>
    </div>

    <!-- 3. Normal Home Video Area -->
    <div class="video-container" id="normal-video-container">
        <div class="video-wrapper">
            <span class="label">Aapka Camera</span>
            <video id="local-video" autoplay playsinline muted></video>
        </div>
        <div id="group-videos"></div>
    </div>

    <!-- WhatsApp Style Full Screen Call View -->
    <div id="call-screen">
        <video id="remote-video-fullscreen" autoplay playsinline></video>
        <video class="local-video-pip" id="local-video-pip" autoplay playsinline muted></video>
        <div class="call-controls">
            <button id="fs-record-btn" onclick="toggleRecording()" style="background-color: #7c3aed;">🔴 Record</button>
            <button onclick="switchCamera()" style="background-color: #ea580c;">📷 Switch</button>
            <button onclick="endCall()" style="background-color: #dc2626;">📞 End Call</button>
        </div>
    </div>

    <script>
        const welcomeCard = document.getElementById('welcome-card');
        const dashboardCard = document.getElementById('dashboard-card');
        const userNameInput = document.getElementById('user-name');
        const userPhoneInput = document.getElementById('user-phone');
        const profileNameSpan = document.getElementById('profile-name');
        const displayMyId = document.getElementById('display-my-id');
        const partnerPhoneInput = document.getElementById('partner-phone-input');
        const savedContactsDropdown = document.getElementById('saved-contacts-dropdown');
        const localVideo = document.getElementById('local-video');
        const localVideoPip = document.getElementById('local-video-pip');
        const remoteVideoFullscreen = document.getElementById('remote-video-fullscreen');
        const callScreen = document.getElementById('call-screen');
        const normalVideoContainer = document.getElementById('normal-video-container');
        const mainHeader = document.getElementById('main-header');
        const mainSubtext = document.getElementById('main-subtext');
        const groupVideos = document.getElementById('group-videos');
        const switchBtn = document.getElementById('switch-btn');
        const endCallBtn = document.getElementById('end-call-btn');
        const recordBtn = document.getElementById('record-btn');
        const netStatus = document.getElementById('net-status');

        let peer;
        let localStream;
        let currentCall = null;
        let currentFacingMode = 'user';
        let myUniqueId = '';
        
        let mediaRecorder;
        let recordedChunks = [];

        window.onload = function() {
            const savedName = localStorage.getItem('sky_user_name');
            const savedPhone = localStorage.getItem('sky_user_phone');
            
            if (savedName && savedPhone) {
                userNameInput.value = savedName;
                userPhoneInput.value = savedPhone;
                saveUserProfile();
            }
            loadContacts();
            checkNetworkStatus();
            window.addEventListener('online', checkNetworkStatus);
            window.addEventListener('offline', checkNetworkStatus);
        };

        function checkNetworkStatus() {
            if (navigator.onLine) {
                netStatus.innerText = "Online / Low-Bandwidth Mode";
                netStatus.style.color = "#34d399";
            } else {
                netStatus.innerText = "Offline / Satellite Link Waiting";
                netStatus.style.color = "#f87171";
            }
        }

        const lowBandwidthConstraints = {
            video: { 
                facingMode: currentFacingMode,
                width: { ideal: 320 },
                height: { ideal: 240 },
                frameRate: { max: 15 }
            },
            audio: {
                echoCancellation: true,
                noiseSuppression: true
            }
        };

        navigator.mediaDevices.getUserMedia(lowBandwidthConstraints)
            .then(stream => {
                localStream = stream;
                localVideo.srcObject = stream;
                localVideoPip.srcObject = stream;
            })
            .catch(err => {
                console.error("Camera error:", err);
            });

        async function pickContactFromPhone() {
            if ('contacts' in navigator && ('ContactsManager' in window || navigator.contacts.select)) {
                try {
                    const props = ['name', 'tel'];
                    const opts = { multiple: false };
                    const contacts = await navigator.contacts.select(props, opts);
                    if (contacts && contacts.length > 0) {
                        const contact = contacts[0];
                        const name = contact.name ? contact.name[0] : "Unknown";
                        let phone = contact.tel ? contact.tel[0] : "";
                        phone = phone.replace(/\D/g, ''); 
                        if (phone.length > 10) {
                            phone = phone.slice(-10);
                        }
                        
                        if (phone) {
                            partnerPhoneInput.value = phone;
                            let savedContacts = JSON.parse(localStorage.getItem('sky_saved_contacts') || '[]');
                            if (!savedContacts.some(c => c.phone === phone)) {
                                savedContacts.push({ name, phone });
                                localStorage.setItem('sky_saved_contacts', JSON.stringify(savedContacts));
                                loadContacts();
                            }
                            alert("Contact chuna gaya: " + name);
                        }
                    }
                } catch (ex) {
                    alert("Contact select karne mein cancel ya error ho gaya.");
                }
            } else {
                alert("Aapka browser direct phone contact picker support nahi karta. Kripya number manual daalein.");
            }
        }

        function startVoiceInput(targetId, event) {
            const inputField = document.getElementById(targetId);
            const btn = event.currentTarget;

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Aapka browser voice typing support nahi karta!");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            btn.classList.add('listening');
            recognition.start();

            recognition.onresult = (event) => {
                let speechText = event.results[0][0].transcript;
                speechText = speechText.replace(/\D/g, ''); 
                inputField.value = speechText;
                btn.classList.remove('listening');
            };

            recognition.onerror = () => {
                alert("Awaz sunai nahi di, dobara koshish karein.");
                btn.classList.remove('listening');
            };

            recognition.onspeechend = () => {
                recognition.stop();
                btn.classList.remove('listening');
            };
        }

        function saveUserProfile() {
            const name = userNameInput.value.trim();
            const phone = userPhoneInput.value.trim();

            if (!name || !phone) {
                alert("Kripya apna naam aur mobile number bharein!");
                return;
            }

            localStorage.setItem('sky_user_name', name);
            localStorage.setItem('sky_user_phone', phone);

            myUniqueId = "sky_" + phone;

            peer = new Peer(myUniqueId);

            peer.on('open', (id) => {
                profileNameSpan.innerText = name;
                displayMyId.innerText = phone;
                welcomeCard.style.display = 'none';
                dashboardCard.style.display = 'block';

                if (/Mobi|Android/i.test(navigator.userAgent)) {
                    switchBtn.style.display = 'inline-block';
                }
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    profileNameSpan.innerText = name;
                    displayMyId.innerText = phone;
                    welcomeCard.style.display = 'none';
                    dashboardCard.style.display = 'block';
                } else {
                    alert("Connection error: " + err.type);
                }
            });

            peer.on('call', (call) => {
                currentCall = call;
                call.answer(localStream);
                call.on('stream', (remoteStream) => {
                    handleActiveCallStream(remoteStream);
                });
                call.on('close', () => {
                    resetCallUI();
                });
            });
        }

        function loadContacts() {
            let contacts = JSON.parse(localStorage.getItem('sky_saved_contacts') || '[]');
            savedContactsDropdown.innerHTML = '<option value="">-- Saved Travelers --</option>';
            contacts.forEach(c => {
                let opt = document.createElement('option');
                opt.value = c.phone;
                opt.textContent = c.name + " (" + c.phone + ")";
                savedContactsDropdown.appendChild(opt);
            });
        }

        function selectContact(selectObj) {
            if (selectObj.value) {
                partnerPhoneInput.value = selectObj.value;
            }
        }

        function downloadContactsBackup() {
            let contacts = localStorage.getItem('sky_saved_contacts') || '[]';
            let blob = new Blob([contacts], { type: 'application/json' });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = 'sky_contacts_backup.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function toggleRecording() {
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                startRecording();
            } else {
                stopRecording();
            }
        }

        function startRecording() {
            recordedChunks = [];
            if (!localStream) {
                alert("Recording ke liye camera stream available nahi hai!");
                return;
            }

            try {
                mediaRecorder = new MediaRecorder(localStream, { mimeType: 'video/webm;codecs=vp8,opus' });
            } catch (e) {
                try {
                    mediaRecorder = new MediaRecorder(localStream);
                } catch (err) {
                    alert("Aapka browser video recording support nahi karta!");
                    return;
                }
            }

            mediaRecorder.ondataavailable = function(event) {
                if (event.data && event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = function() {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = 'sky-call-recording-' + Date.now() + '.webm';
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 100);
                alert("Call recording download ho gayi hai!");
            };

            mediaRecorder.start();
            recordBtn.innerText = "⏹️ Stop Recording";
            recordBtn.classList.add('recording');
            document.getElementById('fs-record-btn').innerText = "⏹️ Stop";
            alert("Recording shuru ho chuki hai...");
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
                recordBtn.innerText = "🔴 Record Call (Start)";
                recordBtn.classList.remove('recording');
                document.getElementById('fs-record-btn').innerText = "🔴 Record";
            }
        }

        function connectCall() {
            const partnerPhone = partnerPhoneInput.value.trim();
            if (!partnerPhone) {
                alert("Dost ka mobile number daalein ya select karein!");
                return;
            }

            const partnerPeerId = "sky_" + partnerPhone;
            if (partnerPeerId === myUniqueId) {
                alert("Khud ko call nahi lag sakti!");
                return;
            }

            const call = peer.call(partnerPeerId, localStream);
            currentCall = call;

            call.on('stream', (remoteStream) => {
                handleActiveCallStream(remoteStream);
            });
            call.on('close', () => {
                resetCallUI();
            });
            alert("Call connect ki ja rahi hai...");
        }

        function startGroupCall() {
            const roomName = prompt("Group Room ke liye naam ya number daalein:");
            if (!roomName) return;

            const groupPeerId = "sky_group_" + roomName;
            const call = peer.call(groupPeerId, localStream);
            currentCall = call;

            call.on('stream', (remoteStream) => {
                handleActiveCallStream(remoteStream);
            });
            call.on('close', () => {
                resetCallUI();
            });
            alert("Group Room mein jud gaye hain!");
        }

        function handleActiveCallStream(stream) {
            remoteVideoFullscreen.srcObject = stream;
            localVideoPip.srcObject = localStream;
            
            // Hide dashboard & normal view, show WhatsApp style full screen
            dashboardCard.style.display = 'none';
            mainHeader.style.display = 'none';
            mainSubtext.style.display = 'none';
            normalVideoContainer.style.display = 'none';
            callScreen.style.display = 'flex';
            
            endCallBtn.style.display = 'inline-block';
            recordBtn.style.display = 'inline-block';
        }

        function endCall() {
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                stopRecording();
            }
            if (currentCall) {
                currentCall.close();
            }
            resetCallUI();
            alert("Call kaat di gayi hai.");
        }

        function resetCallUI() {
            callScreen.style.display = 'none';
            mainHeader.style.display = 'flex';
            mainSubtext.style.display = 'block';
            dashboardCard.style.display = 'block';
            normalVideoContainer.style.display = 'flex';
            
            groupVideos.innerHTML = '';
            endCallBtn.style.display = 'none';
            recordBtn.style.display = 'none';
            currentCall = null;
        }

        function switchCamera() {
            currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
            
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }

            const updatedConstraints = {
                video: { 
                    facingMode: currentFacingMode,
                    width: { ideal: 320 },
                    height: { ideal: 240 },
                    frameRate: { max: 15 }
                },
                audio: true
            };

            navigator.mediaDevices.getUserMedia(updatedConstraints)
                .then(stream => {
                    localStream = stream;
                    localVideo.srcObject = stream;
                    localVideoPip.srcObject = stream;
                    replaceTrack(stream);
                })
                .catch(err => console.error(err));
        }

        function replaceTrack(newStream) {
            const videoTrack = newStream.getVideoTracks()[0];
            if (peer && peer.connections) {
                Object.keys(peer.connections).forEach(connId => {
                    peer.connections[connId].forEach(connection => {
                        if (connection.peerConnection) {
                            const sender = connection.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                            if (sender) {
                                sender.replaceTrack(videoTrack);
                            }
                        }
                    });
                });
            }
        }
    </script>
</body>
</html>
